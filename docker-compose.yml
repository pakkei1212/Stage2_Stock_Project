version: "3.9"

# ── Shared environment variables ─────────────────────────────────────────────
# Values here can be overridden in .env (see .env.example)
x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Pass-through — override in .env if you want Jupyter token auth
  JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
  # Pass-through — required by pipeline/stage_vcp_analysis.py (Stage G)
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
  VCP_TOP_N: ${VCP_TOP_N:-20}
  # Pipeline logging verbosity — DEBUG/INFO/WARNING/ERROR (see pipeline/logging_config.py)
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # OHLCV price cache — set to 0 to disable and always download fresh (see pipeline/ohlcv_cache.py)
  OHLCV_CACHE: ${OHLCV_CACHE:-1}
  # Stage G live Claude VCP analysis — set to 0 for token-free runs (metrics + charts only)
  VCP_LIVE_ANALYSIS: ${VCP_LIVE_ANALYSIS:-0}
  VCP_LLM_REVIEW_MODE: ${VCP_LLM_REVIEW_MODE:-selective}
  # Stage H: session-aware scheduler (pipeline/scheduler.py) — see README "Scheduled operation"
  # Main check frequency: SCHEDULE_MODE=daily|times|interval (not the runner's cron SCHEDULE)
  SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-1}
  SCHEDULE_MODE: ${SCHEDULE_MODE:-daily}
  SCHEDULE_TIMES: ${SCHEDULE_TIMES:-}
  SCHEDULE_INTERVAL_MINUTES: ${SCHEDULE_INTERVAL_MINUTES:-60}
  LOCAL_SCHEDULER_TIME: ${LOCAL_SCHEDULER_TIME:-09:15}
  LOCAL_SCHEDULER_TIMEZONE: ${LOCAL_SCHEDULER_TIMEZONE:-Asia/Singapore}
  RUN_ON_STARTUP_CHECK: ${RUN_ON_STARTUP_CHECK:-1}
  DATA_READY_RETRY_MINUTES: ${DATA_READY_RETRY_MINUTES:-10}
  DATA_READY_MAX_ATTEMPTS: ${DATA_READY_MAX_ATTEMPTS:-3}
  DEFERRED_RETRY_ENABLED: ${DEFERRED_RETRY_ENABLED:-1}
  DEFERRED_RETRY_MINUTES: ${DEFERRED_RETRY_MINUTES:-60}
  DEFERRED_RETRY_CUTOFF: ${DEFERRED_RETRY_CUTOFF:-20:30}
  HISTORY_DB_PATH: ${HISTORY_DB_PATH:-data/history/stage2_history.sqlite3}
  TREND_TOP_N: ${TREND_TOP_N:-10}
  TREND_LOOKBACK_SESSIONS: ${TREND_LOOKBACK_SESSIONS:-10}
  # Telegram — credentials pass through from .env only; never put real values here
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-0}
  TELEGRAM_SEND_CHARTS: ${TELEGRAM_SEND_CHARTS:-1}
  TELEGRAM_VCP_CHART_MAX: ${TELEGRAM_VCP_CHART_MAX:-10}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  # Stage I: advisory trade journal + position monitor (pipeline/trade_store.py,
  # pipeline/position_monitor.py). Records fills YOU report and monitors public
  # market data — there is no brokerage API, no account access and no order
  # placement anywhere in this project. Planning parameters only.
  TRADE_JOURNAL_ENABLED: ${TRADE_JOURNAL_ENABLED:-1}
  TRADE_DB_PATH: ${TRADE_DB_PATH:-data/trades/trade_journal.sqlite3}
  PORTFOLIO_VALUE: ${PORTFOLIO_VALUE:-100000}
  RISK_PER_TRADE_PCT: ${RISK_PER_TRADE_PCT:-1.0}
  MAX_POSITION_PORTION_PCT: ${MAX_POSITION_PORTION_PCT:-25}
  MAX_RISK_PCT: ${MAX_RISK_PCT:-10}
  # Telegram trade-journal bot (separate long-poll process: python -m pipeline.trade_bot).
  # Mutating commands are accepted ONLY from TELEGRAM_ALLOWED_CHAT_ID.
  TRADE_BOT_ENABLED: ${TRADE_BOT_ENABLED:-0}
  TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
  TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
  # Optional: the image has no .git, so pass the commit for run reproducibility metadata
  GIT_COMMIT: ${GIT_COMMIT:-}

services:

  # ── 1. Interactive Jupyter notebook ────────────────────────────────────────
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: nasdaq-stage2-screener:latest
    container_name: stage2_jupyter
    environment:
      <<: *common-env
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      # Your notebooks — edits inside the container are persisted here
      - ./notebooks:/app/notebooks
      # Persistent data: sector_cache.csv, output watchlist CSVs
      - ./data:/app/data
    working_dir: /app/notebooks
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── 2. Scheduled headless runner (optional) ────────────────────────────────
  # Runs the notebook non-interactively via nbconvert on a cron-like schedule.
  # Disabled by default (profile: scheduled) — enable with:
  #   docker compose --profile scheduled up
  #
  # The SCHEDULE env var uses standard cron syntax (default: weekdays at 18:00 local).
  # SCHEDULE is for this notebook runner only; the `pipeline` service below is
  # driven by SCHEDULE_MODE / LOCAL_SCHEDULER_TIME / SCHEDULE_TIMES / SCHEDULE_INTERVAL_MINUTES.
  # Output notebooks (with cell outputs) are saved to /app/data/runs/.
  runner:
    image: nasdaq-stage2-screener:latest
    container_name: stage2_runner
    profiles:
      - scheduled
    environment:
      <<: *common-env
      # Cron schedule — default: Mon-Fri at 18:00
      SCHEDULE: ${SCHEDULE:-0 18 * * 1-5}
      NOTEBOOK_NAME: ${NOTEBOOK_NAME:-nasdaq_stage2_screener.ipynb}
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
    # Use supercronic (a cron daemon that logs to stdout) to run the notebook
    # on schedule. Install it and nbconvert in the entrypoint so we don't
    # bloat the base image used by the jupyter service.
    entrypoint: >
      /bin/sh -c "
        mkdir -p /app/data/runs &&
        CRON_FILE=/etc/cron.d/stage2_runner &&
        echo \"$$SCHEDULE /bin/sh /app/run_notebook.sh\" > $$CRON_FILE &&
        chmod 0644 $$CRON_FILE &&
        echo \"Scheduled job: [$$SCHEDULE] -> $$NOTEBOOK_NAME\" &&
        exec cron -f
      "
    restart: unless-stopped

  # ── 3. Session-aware pipeline scheduler (Stage A-G + history + Telegram) ──
  # Native-Python pipeline driven by pipeline/scheduler.py — the same code the
  # Windows Task Scheduler setup runs. Long-running: a startup catch-up check,
  # then checks per SCHEDULE_MODE (default daily at LOCAL_SCHEDULER_TIME, in
  # LOCAL_SCHEDULER_TIMEZONE), every calendar day. It only runs Stage A-G when the latest completed NASDAQ
  # session has no successful result yet, so restarts never duplicate runs.
  # Disabled by default (profile: scheduled) — enable with:
  #   docker compose --profile scheduled up -d pipeline
  # Run the scheduler in ONE place only (this container OR the Windows task):
  # file locks are not shared reliably across the Docker Desktop bind mount.
  pipeline:
    image: nasdaq-stage2-screener:latest
    container_name: stage2_pipeline
    profiles:
      - scheduled
    environment:
      <<: *common-env
    volumes:
      - ./data:/app/data
    working_dir: /app
    entrypoint: ["python", "-m", "pipeline.scheduler"]
    restart: unless-stopped
